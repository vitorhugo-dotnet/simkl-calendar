name: Deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare production configuration
        id: production_config
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          SUBSCRIPTIONS_APPROVED: ${{ vars.SUBSCRIPTIONS_APPROVED || 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if (!process.env.APP_ORIGIN?.trim()) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'configured=false\n');
            console.log('::notice::Skipping deployment because production APP_ORIGIN is not configured.');
            process.exit(0);
          }
          const origin = new URL(process.env.APP_ORIGIN);
          if (origin.protocol !== 'https:' || origin.username || origin.password || origin.search || origin.hash || origin.pathname !== '/') {
            throw new Error('APP_ORIGIN must be a canonical HTTPS origin');
          }
          if (!['true', 'false'].includes(process.env.SUBSCRIPTIONS_APPROVED)) {
            throw new Error('SUBSCRIPTIONS_APPROVED must be true or false');
          }
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.main = '../src/index.ts';
          config.vars.APP_ORIGIN = origin.origin;
          config.vars.SUBSCRIPTIONS_APPROVED = process.env.SUBSCRIPTIONS_APPROVED;
          fs.mkdirSync('.wrangler', { recursive: true });
          fs.writeFileSync('.wrangler/deploy.jsonc', JSON.stringify(config));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'configured=true\n');
          NODE
      - name: Verify revision is still main head
        id: revision
        if: steps.production_config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" = "$DEPLOY_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping an outdated revision.'
          fi
      - uses: cloudflare/wrangler-action@v4
        if: steps.production_config.outputs.configured == 'true' && steps.revision.outputs.current == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .wrangler/deploy.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
